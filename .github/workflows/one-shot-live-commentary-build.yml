name: One-shot live commentary build

on:
  push:
    branches:
      - one-shot-live-commentary-build
    paths:
      - .github/workflows/one-shot-live-commentary-build.yml

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply live-commentary patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/live-commentary.patch
          patch -p1 < /tmp/live-commentary.patch

      - name: Build release binary
        shell: bash
        run: CARGO_INCREMENTAL=0 cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-claw-linux-x86_64-live-commentary
          path: target/release/codex-claw
          if-no-files-found: error
          retention-days: 1
